<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muhammad Ayan — Python Developer and AI Automation Engineer." />
    <title>Muhammad Ayan | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: { ink: "#080b12", panel: "#101827", accent: "#4ade80" },
          },
        },
      };
    </script>
  </head>
  <body class="bg-ink font-sans text-slate-100 antialiased">
    <main class="min-h-screen overflow-hidden bg-[radial-gradient(circle_at_85%_20%,rgba(34,197,94,0.13),transparent_25%),radial-gradient(circle_at_10%_90%,rgba(59,130,246,0.12),transparent_30%)]">
      <section class="mx-auto flex min-h-screen max-w-6xl items-center px-6 py-16 lg:px-8">
        <div class="grid w-full items-center gap-14 lg:grid-cols-[1.2fr_0.8fr]">
          <div>
            <p class="mb-5 inline-flex items-center gap-2 rounded-full border border-emerald-400/25 bg-emerald-400/10 px-4 py-2 text-sm font-medium text-emerald-300">
              <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
              Islamabad, Pakistan
            </p>
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-sky-300">Hello, I’m</p>
            <h1 class="text-5xl font-bold tracking-tight text-white sm:text-6xl">Muhammad Ayan</h1>
            <h2 class="mt-5 text-2xl font-semibold leading-tight text-slate-300 sm:text-3xl">Python Developer &amp; AI Automation Engineer</h2>
            <p class="mt-4 h-8 text-xl font-medium text-emerald-300 sm:text-2xl" aria-live="polite">
              <span id="typewriter"></span><span class="ml-0.5 animate-pulse">|</span>
            </p>
            <p class="mt-6 max-w-xl text-lg leading-8 text-slate-400">Building secure, automated systems with Python and AI.</p>
            <p class="mt-3 text-sm text-slate-500">Aspiring AI Security Engineer</p>

            <nav class="mt-9 flex flex-wrap gap-3" aria-label="Contact links">
              <a class="rounded-lg bg-emerald-400 px-5 py-3 font-semibold text-slate-950 transition hover:bg-emerald-300" href="mailto:your.email@example.com">Email</a>
              <a class="rounded-lg border border-slate-600 px-5 py-3 font-semibold text-slate-200 transition hover:border-sky-300 hover:text-sky-300" href="https://github.com/yourusername" target="_blank" rel="noreferrer">GitHub</a>
              <a class="rounded-lg border border-slate-600 px-5 py-3 font-semibold text-slate-200 transition hover:border-sky-300 hover:text-sky-300" href="https://www.linkedin.com/in/yourusername" target="_blank" rel="noreferrer">LinkedIn</a>
              <a class="rounded-lg border border-slate-600 px-5 py-3 font-semibold text-slate-200 transition hover:border-sky-300 hover:text-sky-300" href="https://x.com/yourusername" target="_blank" rel="noreferrer">X / Twitter</a>
              <a class="rounded-lg border border-slate-600 px-5 py-3 font-semibold text-slate-200 transition hover:border-sky-300 hover:text-sky-300" href="https://yourportfolio.example" target="_blank" rel="noreferrer">Portfolio</a>
            </nav>
          </div>

          <div class="order-first flex justify-center lg:order-last lg:justify-end">
            <div class="relative">
              <div class="absolute -inset-4 rounded-full bg-gradient-to-br from-emerald-400 via-sky-400 to-indigo-500 opacity-50 blur-xl"></div>
              <img src="profile.jpg" alt="Muhammad Ayan" class="relative h-64 w-64 rounded-full border-4 border-slate-800 object-cover shadow-2xl sm:h-80 sm:w-80" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const roles = [
        "Python Developer",
        "AI Automation Engineer",
        "AI Security Engineer (Aspiring)",
        "Backend & Automation Specialist",
      ];
      const target = document.getElementById("typewriter");
      let roleIndex = 0;
      let characterIndex = 0;
      let deleting = false;

      function type() {
        const currentRole = roles[roleIndex];
        target.textContent = currentRole.slice(0, characterIndex);

        if (!deleting && characterIndex < currentRole.length) {
          characterIndex += 1;
          setTimeout(type, 70);
        } else if (!deleting) {
          deleting = true;
          setTimeout(type, 1500);
        } else if (characterIndex > 0) {
          characterIndex -= 1;
          setTimeout(type, 35);
        } else {
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
          setTimeout(type, 250);
        }
      }

      type();
    </script>
  </body>
</html>
